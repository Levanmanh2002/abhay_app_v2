name: abhay_app_v2
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  intl: ^0.19.0
  json_annotation: ^4.9.0
  http: ^1.6.0
  flutter_dotenv: ^6.0.0
  calendar_date_picker2: ^2.0.1
  toastification: ^3.0.3
  flutter_easyloading: ^3.0.5
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  skeletonizer: ^1.4.3
  dartx: ^1.2.0
  launch_at_startup: ^0.3.1
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  dismissible_page: ^1.0.2
  smooth_page_indicator: ^2.0.1
  dropdown_button2: ^3.0.0
  pin_code_fields: ^8.0.1
  animated_bottom_navigation_bar: ^1.4.0
  universal_html: ^2.3.0
  flutter_html: ^3.0.0
  url_launcher: ^6.3.2
  sleek_circular_slider: ^2.0.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  json_serializable: any
  build_runner: any
  flutter_gen_runner: 5.13.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo_app/
    - assets/icons/
    - .env

  fonts:
    - family: SFUIDisplayBold
      fonts:
        - asset: assets/fonts/SF-UI-Display-Bold.ttf

    - family: SFUIDisplayRegular
      fonts:
        - asset: assets/fonts/SF-UI-Display-Regular.ttf

flutter_gen:
  output: lib/gen
  integrations:
    flutter_svg: true
